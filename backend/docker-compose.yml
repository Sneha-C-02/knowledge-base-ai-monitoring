version: '3.8'
services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    command: uvicorn src.knowledge_base_backend.main:app --host 0.0.0.0 --port 3000 --reload
    depends_on:
      - test-db

  test-db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
